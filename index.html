<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#faf9f6" />
    <meta
      name="description"
      content="Practice Japanese vocabulary, grammar, verb forms, and everyday conversations with examples, audio, and short drills. Progress stays in your browser."
    />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <title>Kotoba — Japanese learning & practice</title>
    <script>
      try {
        const theme = localStorage.getItem('kotoba-theme') || 'light';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      } catch {
        /* The default light theme also works without storage. */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
